# Every push and pull request: lint, the name check, the Rust checks, the unit
# tests, a `make install` into a scratch root and the shell's windows opened
# offscreen from it, all in a current Arch container. Releases are built by
# release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Tools
        run: |
          pacman -Syu --noconfirm --needed git sudo shellcheck bats jq rust qt6-declarative \
            quickshell ttf-jetbrains-mono-nerd noto-fonts
          useradd -m builder

      - uses: actions/checkout@v4

      - name: Hand the checkout to the build user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Shell lint
        run: sudo -u builder -H make lint-shell

      - name: No Omarchy names outside NOTICE and docs
        run: sudo -u builder -H make check-names

      - name: QML lint
        run: sudo -u builder -H make lint-qml

      - name: Rust
        run: |
          sudo -u builder -H cargo fmt --check
          sudo -u builder -H cargo clippy --locked --all-targets -- -D warnings
          sudo -u builder -H cargo test --locked

      - name: Unit tests
        run: sudo -u builder -H make test

      - name: Install into a scratch root
        run: |
          sudo -u builder -H cargo build --locked --release
          sudo -u builder -H make install DESTDIR=/tmp/nova-root
          test -x /tmp/nova-root/usr/bin/nova

      # What qmllint cannot see: the windows opened offscreen against the
      # installed tree, failing on any QML warning at runtime.
      - name: Shell windows, offscreen
        run: sudo -u builder -H tools/qml-smoke --root /tmp/nova-root --shots /tmp/nova-shots

      - name: Keep the window screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-windows
          path: /tmp/nova-shots
          if-no-files-found: ignore
