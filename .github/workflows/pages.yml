# Nova's site on GitHub Pages: the landing page (site/), with the pictures it
# shows taken from the docs' own (docs/images, made by tools/screenshots), and
# a page for each user doc (docs/*.md), all built by tools/build-site, which
# fails on a link or picture that leads nowhere. Published at each push to main
# that changes any of them.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'tools/build-site'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time, and one under way is let finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Arch's cmark-gfm and gawk, as CI builds the site with.
    container:
      image: archlinux:base
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git cmark-gfm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: The site
        run: tools/build-site --out _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
