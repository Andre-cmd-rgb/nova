# A release candidate every other week, on the 1st and the 15th: CI on main,
# then the next candidate tag (tools/release-next), built against yesterday's
# Arch snapshot and published as a pre-release, which only systems already on
# a pre-release follow. Once it has been tested on the machines, promote.yml
# makes it the release. See docs/releasing.md.
name: candidate

on:
  schedule:
    - cron: '17 6 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  tag:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # The commit CI just tested, not whatever main is by now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      # Before a tag exists: without the key every release fails at signing.
      - name: The signing key is set up
        env:
          NOVA_REPO_KEY: ${{ secrets.NOVA_REPO_KEY }}
        run: |
          [[ -n $NOVA_REPO_KEY && -f packaging/nova-keyring/nova.gpg ]] ||
            { echo "::error::no signing key yet: see docs/releasing.md, The signing key"; exit 1; }
      - id: tag
        name: Tag the next candidate
        run: |
          tag=$(tools/release-next)
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            tag -a "$tag" -m "Nova ${tag#v}"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  release:
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      publish: true
    secrets: inherit
