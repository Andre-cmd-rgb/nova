# A release: pins an Arch Linux Archive snapshot (yesterday's, unless given),
# builds every Nova package against it, signs them into the [nova] repository,
# builds the installer ISO, installs from it in a virtual machine and boots the
# result, and only then puts it all on a GitHub release: a draft when a tag is
# pushed by hand, published when candidate.yml or promote.yml calls it. A tag
# with a "-" is a pre-release. See docs/releasing.md.
#
# Needs the repository secret NOVA_REPO_KEY: the ASCII-armored private key whose
# public half is in packaging/nova-keyring.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v1.0.0-beta.1
        required: true
      arch_date:
        description: Arch Linux Archive date, YYYY/MM/DD (empty for yesterday)
        default: ''
      publish:
        description: Publish the release instead of leaving a draft
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      arch_date:
        type: string
        default: ''
      publish:
        type: boolean
        default: false
    secrets:
      NOVA_REPO_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      arch_date: ${{ steps.pin.outputs.arch_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: pin
        name: Pin the Arch snapshot
        env:
          ARCH_DATE: ${{ inputs.arch_date }}
        run: |
          date=${ARCH_DATE:-$(date -u -d yesterday +%Y/%m/%d)}
          tools/release-pin --version "$TAG" --date "$date" --verify --out release.toml
          echo "arch_date=$date" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-toml
          path: release.toml

  kernel:
    needs: pin
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      volumes:
        - /mnt:/mnt # the runner's scratch disk: a kernel build tree outgrows the root disk
    # A full kernel build takes hours on a hosted runner, so a build is reused
    # until packaging/linux-nova changes.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: cache
        uses: actions/cache@v6
        with:
          path: out/kernel
          key: linux-nova-${{ hashFiles('packaging/linux-nova/**') }}
      - name: Build linux-nova
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tools/ci-setup --date "${{ needs.pin.outputs.arch_date }}"
          NOVA_BUILD_ROOT=/mnt tools/build-package packaging/linux-nova out/kernel
      - uses: actions/upload-artifact@v7
        with:
          name: kernel
          path: out/kernel/*.pkg.tar.zst

  packages:
    needs: [pin, kernel]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 120
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the nova package's version comes from git describe
      - uses: actions/download-artifact@v8
        with:
          name: kernel
          path: out/kernel
      - name: Build the packages
        run: |
          tools/ci-setup --date "${{ needs.pin.outputs.arch_date }}"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          test -f packaging/nova-keyring/nova.gpg ||
            { echo "::error::packaging/nova-keyring has no key yet; see docs/releasing.md"; exit 1; }
          tools/build-package packaging/nova-keyring out/pkgs
          tools/build-package packaging/limine-entry-tool out/pkgs
          tools/build-package packaging/limine-snapper-sync out/pkgs
          # nova depends on these three, which no Arch repository has. Building
          # it with --syncdeps also proves every other dependency exists in the
          # pinned snapshot.
          pacman -U --noconfirm out/pkgs/nova-keyring-*.pkg.tar.zst \
            out/pkgs/limine-entry-tool-*.pkg.tar.zst out/pkgs/limine-snapper-sync-*.pkg.tar.zst
          NOVA_SOURCE="git+file://$GITHUB_WORKSPACE#tag=$TAG" tools/build-package packaging/nova out/pkgs
          pacman -U --noconfirm out/kernel/linux-nova-headers-*.pkg.tar.zst
          # The NVIDIA modules follow the snapshot's driver and this kernel.
          nvidia=$(pacman -Si nvidia-open-dkms | sed -n 's/^Version *: \(.*\)-[^-]*$/\1/p')
          kernel=$(pacman -Q linux-nova-headers | awk '{ print $2 }')
          sed -i "s/^pkgver=.*/pkgver=${nvidia}_${kernel//-/_}/; s/^pkgrel=.*/pkgrel=1/" packaging/nvidia-open-nova/PKGBUILD
          tools/build-package packaging/nvidia-open-nova out/pkgs
          cp out/kernel/*.pkg.tar.zst out/pkgs/
          ls -l out/pkgs
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: out/pkgs/*.pkg.tar.zst

  repo:
    needs: packages
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: out/pkgs
      - name: Sign into the [nova] repository
        env:
          NOVA_REPO_KEY: ${{ secrets.NOVA_REPO_KEY }}
        run: |
          [[ -n $NOVA_REPO_KEY ]] || { echo "::error::the NOVA_REPO_KEY secret is not set"; exit 1; }
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --quiet --import <<<"$NOVA_REPO_KEY"
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          grep -qx "$fpr:4:" packaging/nova-keyring/nova-trusted ||
            { echo "::error::NOVA_REPO_KEY is not the key in packaging/nova-keyring"; exit 1; }
          tools/repo-build --key "$fpr" out/pkgs out/repo
          gpgconf --kill all
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@v7
        with:
          name: repo
          path: out/repo/

  iso:
    needs: [pin, repo]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged # mkarchiso mounts /proc and /dev inside the image it builds
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: release-toml
      - uses: actions/download-artifact@v8
        with:
          name: repo
          path: out/repo
      - name: Build the installer ISO
        run: |
          tools/ci-setup --date "${{ needs.pin.outputs.arch_date }}" archiso
          # The build host trusts the Nova key the same way an installed system does.
          pacman -U --noconfirm out/repo/nova-keyring-*.pkg.tar.zst
          tools/build-iso --release release.toml --repo out/repo --out out/iso
      - uses: actions/upload-artifact@v7
        with:
          name: iso
          path: out/iso/

  # The ISO as someone would use it: a stick made from it, an install with no
  # questions in a KVM virtual machine, and the first boot checked from inside.
  install-test:
    needs: [pin, repo, iso]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged # /dev/kvm
      volumes:
        - /mnt:/mnt # the runner's scratch disk: the stick and the disk images
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: release-toml
      - uses: actions/download-artifact@v8
        with:
          name: repo
          path: out/repo
      - uses: actions/download-artifact@v8
        with:
          name: iso
          path: out/iso
      - name: Install it in QEMU, then boot it
        run: |
          tools/ci-setup --date "${{ needs.pin.outputs.arch_date }}" qemu-base qemu-ui-gtk qemu-ui-opengl \
            qemu-hw-display-virtio-gpu qemu-hw-display-virtio-gpu-gl qemu-hw-display-virtio-vga \
            qemu-hw-display-virtio-vga-gl virglrenderer mesa xorg-server-xvfb edk2-ovmf mtools dosfstools libarchive
          TMPDIR=/mnt tests/install/run --iso out/iso/nova-*.iso --repo out/repo --release release.toml \
            --packages out/iso/packages.txt --logs /tmp/install-logs
      - name: Keep the serial logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-logs
          path: /tmp/install-logs
          if-no-files-found: ignore

  publish:
    needs: [repo, iso, install-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          version=${TAG#v}
          flags=(--generate-notes)
          [[ $PUBLISH == true ]] || flags+=(--draft)
          [[ $version != *-* ]] || flags+=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" --title "Nova $version" \
            --notes "Install: write the ISO to a USB stick, or make one with nova-usb (bash nova-usb, on any Arch-based system), and boot it." \
            out/release-toml/release.toml out/repo/* out/iso/*
