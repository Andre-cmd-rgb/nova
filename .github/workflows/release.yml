# A release: pins an Arch Linux Archive snapshot (yesterday's, unless given),
# builds every Nova package against it, side by side, signs them into the
# [nova] repository, builds the installer ISO, which carries every package an
# install can need, installs from it in a virtual machine and boots the
# result, and only then publishes it: the package repository and the ISO to
# the nova-packages bucket on Cloudflare R2, then the GitHub release, which
# carries nova-usb, the ISO's checksum and release.toml. Once a release is
# published, the folders of the releases before it go from the bucket, but for
# the newest final release's. A draft when a tag is pushed by hand, published when candidate.yml or
# promote.yml calls it. A tag with a "-" is a pre-release. See docs/releasing.md.
#
# Needs the repository secrets NOVA_REPO_KEY (the ASCII-armored private key
# whose public half is in packaging/nova-keyring) and R2_ACCESS_KEY_ID and
# R2_SECRET_ACCESS_KEY (the bucket's token), and the variable R2_ACCOUNT_ID.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v1.0.0-rc.1
        required: true
      arch_date:
        description: Arch Linux Archive date, YYYY/MM/DD (empty for yesterday)
        default: ''
      publish:
        description: Publish the release instead of leaving a draft
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      arch_date:
        type: string
        default: ''
      # The candidate this is, under its final name (promote.yml), which the
      # release's notes name.
      candidate:
        type: string
        default: ''
      publish:
        type: boolean
        default: false
    secrets:
      NOVA_REPO_KEY:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      arch_date: ${{ steps.pin.outputs.arch_date }}
      snapshot: ${{ steps.pin.outputs.snapshot }} # the same date, as a cache's key names it: 2026-11-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - id: pin
        name: Pin the Arch snapshot
        env:
          ARCH_DATE: ${{ inputs.arch_date }}
        run: |
          date=${ARCH_DATE:-$(date -u -d yesterday +%Y/%m/%d)}
          tools/release-pin --version "$TAG" --date "$date" --verify --out release.toml
          echo "arch_date=$date" >>"$GITHUB_OUTPUT"
          echo "snapshot=${date//\//-}" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-toml
          path: release.toml

  kernel:
    needs: pin
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      volumes:
        - /mnt:/mnt # the runner's scratch disk: a kernel build tree outgrows the root disk
    # A full kernel build takes hours on a hosted runner, so a build is reused
    # until packaging/linux-nova changes. kernel-cache.yml keeps it from being
    # dropped between two releases.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/kernel
          key: linux-nova-${{ hashFiles('packaging/linux-nova/**') }}
      - name: Build linux-nova
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tools/ci-setup --date "${{ needs.pin.outputs.arch_date }}"
          NOVA_BUILD_ROOT=/mnt tools/build-package packaging/linux-nova out/kernel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel
          path: out/kernel/*.pkg.tar.zst

  # Nova's other packages, in jobs side by side: one after another they
  # took 17 minutes of a release's 40. Each build is kept under the snapshot
  # and the files it is made from, so a promote, which builds the candidate's
  # commit on the candidate's snapshot, takes them as the candidate's run built
  # them, and so does a run started again. Only nova is built every time: its
  # version is the tag's.

  # nova, and before it the three it depends on that no Arch repository has.
  # Building it with --syncdeps also proves every other dependency exists in
  # the pinned snapshot.
  nova:
    needs: pin
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the nova package's version comes from git describe
      - id: built
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/before
          key: before-nova-${{ needs.pin.outputs.snapshot }}-${{ hashFiles('packaging/nova-keyring/**', 'packaging/limine-entry-tool/**', 'packaging/limine-snapper-sync/**', 'packaging/cmatrix/**', 'tools/build-package', 'tools/ci-setup') }}
      - name: Build the packages
        env:
          BUILT: ${{ steps.built.outputs.cache-hit }}
        run: |
          tools/ci-setup --date "${{ needs.pin.outputs.arch_date }}"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          # pacman -U fetches dependencies from the archive, which stalls now and then.
          retry() { "$@" || { sleep 30; "$@"; } || { sleep 30; "$@"; }; }
          test -f packaging/nova-keyring/nova.gpg ||
            { echo "::error::packaging/nova-keyring has no key yet; see docs/releasing.md"; exit 1; }
          if [[ $BUILT != true ]]; then
            tools/build-package packaging/nova-keyring out/before
            tools/build-package packaging/limine-entry-tool out/before
            tools/build-package packaging/limine-snapper-sync out/before
            tools/build-package packaging/cmatrix out/before
          fi
          retry pacman -U --noconfirm out/before/*.pkg.tar.zst
          NOVA_SOURCE="git+file://$GITHUB_WORKSPACE#tag=$TAG" tools/build-package packaging/nova out/pkgs
          cp out/before/*.pkg.tar.zst out/pkgs/
          ls -l out/pkgs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-nova
          path: out/pkgs/*.pkg.tar.zst

  whisper-cpp:
    needs: pin
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - id: built
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/pkgs
          key: whisper-cpp-${{ needs.pin.outputs.snapshot }}-${{ hashFiles('packaging/whisper-cpp/**', 'tools/build-package', 'tools/ci-setup') }}
      - name: Build whisper-cpp
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          tools/ci-setup --date "${{ needs.pin.outputs.arch_date }}"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          tools/build-package packaging/whisper-cpp out/pkgs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-whisper-cpp
          path: out/pkgs/*.pkg.tar.zst

  # Hyprland with Nova's patch, at Arch's pkgrel and Nova's revision of it
  # (packaging/hyprland). Built only while the snapshot's Hyprland is the
  # version the patch is for: a newer one is released as Arch's, without
  # xwayland:scale, until the patch is moved onto it, rather than holding the
  # release up. 45 CPU-minutes, some 15 to 20 on a hosted runner, once per snapshot.
  hyprland:
    needs: pin
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - id: built
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/pkgs
          key: hyprland-${{ needs.pin.outputs.snapshot }}-${{ hashFiles('packaging/hyprland/**', 'tools/build-package', 'tools/ci-setup') }}
      - name: Build hyprland
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          tools/ci-setup --date "${{ needs.pin.outputs.arch_date }}"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          arch=$(pacman -Si hyprland | sed -n 's/^Version *: //p')
          ours=$(sed -n 's/^pkgver=//p' packaging/hyprland/PKGBUILD)
          if [[ ${arch%-*} != "$ours" || ! ${arch##*-} =~ ^[0-9]+$ ]]; then
            echo "::warning::Arch's Hyprland is $arch and packaging/hyprland is for $ours: this release has Arch's, without xwayland:scale, until the patch is moved onto it (docs/packaging.md)"
            exit 0
          fi
          sed -i "s/^pkgrel=[0-9]*\./pkgrel=${arch##*-}./" packaging/hyprland/PKGBUILD
          tools/build-package packaging/hyprland out/pkgs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-hyprland
          path: out/pkgs/*.pkg.tar.zst
          if-no-files-found: ignore # a newer Hyprland in Arch: none built

  # The NVIDIA modules follow the snapshot's driver and this kernel.
  nvidia:
    needs: [pin, kernel]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - id: built
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/pkgs
          key: nvidia-open-nova-${{ needs.pin.outputs.snapshot }}-${{ hashFiles('packaging/nvidia-open-nova/**', 'packaging/linux-nova/**', 'tools/build-package', 'tools/ci-setup') }}
      - if: steps.built.outputs.cache-hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel
          path: out/kernel
      - name: Build nvidia-open-nova
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          tools/ci-setup --date "${{ needs.pin.outputs.arch_date }}"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # pacman -U fetches dependencies from the archive, which stalls now and then.
          retry() { "$@" || { sleep 30; "$@"; } || { sleep 30; "$@"; }; }
          retry pacman -U --noconfirm out/kernel/linux-nova-headers-*.pkg.tar.zst
          nvidia=$(pacman -Si nvidia-open-dkms | sed -n 's/^Version *: \(.*\)-[^-]*$/\1/p')
          kernel=$(pacman -Q linux-nova-headers | awk '{ print $2 }')
          sed -i "s/^pkgver=.*/pkgver=${nvidia}_${kernel//-/_}/; s/^pkgrel=.*/pkgrel=1/" packaging/nvidia-open-nova/PKGBUILD
          tools/build-package packaging/nvidia-open-nova out/pkgs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-nvidia
          path: out/pkgs/*.pkg.tar.zst

  # Arch's own packages for the ISO, which carries every package an install
  # can need, and for the upgrade test: fetched once and beside the builds
  # above, rather than the same 700 from the archive, one server, each time.
  arch-packages:
    needs: pin
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-toml
      - id: key
        env:
          KEY: arch-packages-${{ needs.pin.outputs.snapshot }}-${{ hashFiles('installer/packages', 'installer/nova-install', 'installer/install-*.bash', 'tools/offline-repo', 'data/hardware/*/packages', 'packaging/*/PKGBUILD', 'tools/arch-packages') }}
        run: echo "key=$KEY" >>"$GITHUB_OUTPUT"
      - id: fetched
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/arch
          key: ${{ steps.key.outputs.key }}
          lookup-only: true # the ISO and the upgrade test read it, not this job
      - name: Fetch them from the snapshot
        if: steps.fetched.outputs.cache-hit != 'true'
        run: |
          tools/ci-setup --date "${{ needs.pin.outputs.arch_date }}"
          tools/arch-packages --release release.toml out/arch

  repo:
    needs: [kernel, nova, whisper-cpp, hyprland, nvidia]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel
          path: out/pkgs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: out/pkgs
          merge-multiple: true
      - name: Sign into the [nova] repository
        env:
          NOVA_REPO_KEY: ${{ secrets.NOVA_REPO_KEY }}
        run: |
          [[ -n $NOVA_REPO_KEY ]] || { echo "::error::the NOVA_REPO_KEY secret is not set"; exit 1; }
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --quiet --import <<<"$NOVA_REPO_KEY"
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          grep -qx "$fpr:4:" packaging/nova-keyring/nova-trusted ||
            { echo "::error::NOVA_REPO_KEY is not the key in packaging/nova-keyring"; exit 1; }
          tools/repo-build --key "$fpr" out/pkgs out/repo
          gpgconf --kill all
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo
          path: out/repo/

  iso:
    needs: [pin, repo, arch-packages]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged # mkarchiso mounts /proc and /dev inside the image it builds
      volumes:
        - /mnt:/mnt # the runner's scratch disk: the live system and every package, side by side
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repo
          path: out/repo
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/arch
          key: ${{ needs.arch-packages.outputs.key }}
      - name: Build the installer ISO
        run: |
          # Arch's packages, into pacman's cache: the ISO's are taken from there
          # first (tools/offline-repo), and from the archive for the rest.
          if [[ -d out/arch ]]; then mkdir -p /var/cache/pacman/pkg && cp -a out/arch/. /var/cache/pacman/pkg/ && rm -rf out/arch; fi
          tools/ci-setup --date "${{ needs.pin.outputs.arch_date }}" archiso
          # The build host trusts the Nova key the same way an installed system does.
          # Installed from a copy without its .sig: pacman would check that against
          # the very key this package is what adds, and refuse.
          keyring=$(mktemp -d)
          cp out/repo/nova-keyring-*.pkg.tar.zst "$keyring/"
          pacman -U --noconfirm "$keyring"/nova-keyring-*.pkg.tar.zst
          tools/build-iso --release release.toml --repo out/repo --out out/iso --work /mnt/nova-iso
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso
          path: out/iso/
          compression-level: 0 # squashfs and packages, compressed already
      # The small files of it, for the sign job, which then need not fetch the ISO.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-files
          path: |
            out/iso/*.sha256
            out/iso/nova-usb

  # Signatures for the files read without pacman: release.toml (nova update
  # checks it), the ISO's .sha256 (nova-usb checks it), and nova-usb, for
  # people.
  sign:
    needs: iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-toml
          path: out/files
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso-files
          path: out/files
      - name: Sign the release files
        env:
          NOVA_REPO_KEY: ${{ secrets.NOVA_REPO_KEY }}
        run: |
          [[ -n $NOVA_REPO_KEY ]] || { echo "::error::the NOVA_REPO_KEY secret is not set"; exit 1; }
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --quiet --import <<<"$NOVA_REPO_KEY"
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          grep -qx "$fpr:4:" packaging/nova-keyring/nova-trusted ||
            { echo "::error::NOVA_REPO_KEY is not the key in packaging/nova-keyring"; exit 1; }
          # Checked as nova update and nova-usb will: against the shipped key alone.
          keyring=$(mktemp)
          gpg --batch --dearmor <packaging/nova-keyring/nova.gpg >"$keyring"
          mkdir -p out/signatures
          for file in out/files/*; do
            sig=out/signatures/${file##*/}.sig
            gpg --batch --yes --local-user "$fpr" --detach-sign --no-armor --output "$sig" -- "$file"
            gpgv --quiet --keyring "$keyring" "$sig" "$file"
          done
          ls -l out/signatures
          gpgconf --kill all
          rm -rf "$GNUPGHOME" "$keyring"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: out/signatures/

  # The ISO as someone would use it: a stick made from it, which installs from
  # the packages the ISO carries, an install with no questions in a KVM virtual
  # machine, and the first boot checked from inside.
  # The installer's two disks, each installed and booted: plain, Nova's
  # default, and encrypted. Both on virtio, and plain once more on NVMe, the
  # disk most laptops have, whose partitions are named nvme0n1p1 and p2.
  install-test:
    needs: [pin, iso]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        disk: [plain, encrypted]
        bus: [virtio]
        include:
          - disk: plain
            bus: nvme
    container:
      image: archlinux:base-devel
      options: --privileged # /dev/kvm
      volumes:
        - /mnt:/mnt # the runner's scratch disk: the stick and the disk images
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso
          path: out/iso
      - name: Install it in QEMU, then boot it
        run: |
          tools/ci-setup --date "${{ needs.pin.outputs.arch_date }}" qemu-base qemu-ui-gtk qemu-ui-opengl \
            qemu-hw-display-virtio-gpu qemu-hw-display-virtio-gpu-gl qemu-hw-display-virtio-vga \
            qemu-hw-display-virtio-vga-gl virglrenderer mesa xorg-server-xvfb edk2-ovmf mtools dosfstools libarchive
          TMPDIR=/mnt tests/install/run --iso out/iso/nova-*.iso --logs /tmp/install-logs \
            ${{ matrix.disk == 'encrypted' && '--encrypt' || '' }} ${{ matrix.bus == 'nvme' && '--nvme' || '' }}
      - name: Keep the serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-logs-${{ matrix.disk }}-${{ matrix.bus }}
          path: /tmp/install-logs
          if-no-files-found: ignore
          overwrite: true # a re-run of a failed attempt uploads again

  # An installed release must move forward and back before its successor is
  # published. This installs once, on a plain disk, beside the two install legs.
  upgrade-test:
    needs: [pin, repo, arch-packages]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged # /dev/kvm
      volumes:
        - /mnt:/mnt # the runner's scratch disk: the stick and the disk images
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repo
          path: out/repo
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/arch
          key: ${{ needs.arch-packages.outputs.key }}
      - name: Install the previous release, update, downgrade, and restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # This release's Arch packages, into pacman's cache: the release
          # before is on an older snapshot, and takes from there what has not
          # changed since (all of it, when this is its candidate under its
          # final name).
          if [[ -d out/arch ]]; then mkdir -p /var/cache/pacman/pkg && cp -a out/arch/. /var/cache/pacman/pkg/ && rm -rf out/arch; fi
          tools/ci-setup --date "${{ needs.pin.outputs.arch_date }}" qemu-base qemu-ui-gtk qemu-ui-opengl \
            qemu-hw-display-virtio-gpu qemu-hw-display-virtio-gpu-gl qemu-hw-display-virtio-vga \
            qemu-hw-display-virtio-vga-gl virglrenderer mesa xorg-server-xvfb edk2-ovmf mtools dosfstools libarchive \
            python openssl jq
          # 45 minutes to install, 30 each to update and downgrade, 15 each
          # for the restore and its boot. The outer limit bounds downloads too.
          TMPDIR=/mnt timeout 150m tests/install/run --upgrade --repo out/repo --release release.toml \
            --logs /tmp/upgrade-logs
      - name: Keep the serial and repository logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-logs
          path: /tmp/upgrade-logs
          if-no-files-found: ignore
          overwrite: true

  publish:
    needs: [repo, iso, install-test, upgrade-test, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # With the history and the tags: the release's notes are the commits
      # since the release before it (tools/release-notes).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      # What it publishes, and not the run's other artifacts: the packages a
      # second time, as the jobs built them, and the tests' logs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-toml
          path: out/release-toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repo
          path: out/repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso
          path: out/iso
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
          path: out/signatures
      # A published release's files are never replaced: machines may already
      # have them, and a rebuild differs byte for byte. Only a draft, which
      # nothing reads, is filled in again by a re-run.
      - name: See whether the release is published already
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          published=false
          [[ $draft != false ]] || published=true
          [[ $published == false ]] || echo "::notice::$TAG is published; its files stay as they are"
          echo "published=$published" >>"$GITHUB_OUTPUT"
      # First, so the release is not offered before its packages are there.
      - name: Put the package repository and the ISO in the bucket
        if: steps.published.outputs.published == 'false'
        env:
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: nova-packages
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ACCOUNT: ${{ vars.R2_ACCOUNT_ID }}
        run: |
          [[ -n $ACCOUNT ]] || { echo "::error::the R2_ACCOUNT_ID variable is not set"; exit 1; }
          release=out/release-toml/release.toml
          # Everything but nova-usb, which people download from the release
          # page. The ISO too: it carries every package, which makes it bigger
          # than GitHub takes a file.
          tools/packages-upload --release "$release" \
            "$release" out/repo/* out/iso/*.iso out/iso/*.sha256 out/signatures/*
      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          PUBLISHED: ${{ steps.published.outputs.published }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          version=${TAG#v}
          iso=nova-$version-x86_64.iso
          flags=()
          [[ $PUBLISH == true ]] || flags+=(--draft)
          prerelease=false latest=()
          [[ $version != *-* ]] || prerelease=true
          [[ $prerelease == true || $PUBLISH != true ]] || latest=(--latest)
          flags+=(--prerelease="$prerelease" "${latest[@]}")
          # What a person downloads, and release.toml, which nova update finds
          # here and which says where the packages and the ISO are.
          assets=(out/iso/"$iso.sha256" out/iso/nova-usb
            out/release-toml/release.toml out/signatures/release.toml.sig)
          base=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG
          packages=$(sed -n 's/^nova_repo = "\(.*\)"$/\1/p' out/release-toml/release.toml)
          : >notes.md
          [[ -z $CANDIDATE ]] || printf 'Nova %s is [%s](%s), tested, under its final name.\n\n' \
            "$version" "$CANDIDATE" "https://github.com/$GITHUB_REPOSITORY/releases/tag/$CANDIDATE" >>notes.md
          # What changed, from the commits: GitHub's own notes list pull
          # requests, and Nova's commits go to main without one.
          tools/release-notes "$TAG" "https://github.com/$GITHUB_REPOSITORY" >>notes.md
          cat >>notes.md <<EOF

          **To install**, make a stick with [nova-usb]($base/nova-usb): \`bash nova-usb\` on any Arch-based system (it needs \`gum\`). It writes [the ISO]($packages/$iso), which carries every package, so the stick installs without internet, and can carry your SSH keys and the files you pick over. Writing the ISO to a stick of 4 GB or more yourself works too: check it against [its checksum]($base/$iso.sha256) first.

          nova-usb checks the ISO against its checksum, and the checksum against Nova's signing key, which it carries. [nova-usb.sig]($packages/nova-usb.sig) is nova-usb's own signature, by the key in [nova-keyring](https://github.com/$GITHUB_REPOSITORY/tree/$TAG/packaging/nova-keyring).

          release.toml tells \`nova update\` and the installer which Arch snapshot this release was tested on, and where its packages are: $packages, which pacman reads on its own.
          EOF
          # A re-run after a publish that failed halfway finds its release
          # there: a draft gets this run's files, a published one only its flags.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [[ $PUBLISHED == true ]] || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            edit_flags=(--prerelease="$prerelease" "${latest[@]}")
            [[ $PUBLISH != true ]] || edit_flags+=(--draft=false)
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${edit_flags[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" --title "Nova $version" \
              --notes-file notes.md \
              "${assets[@]}"
          fi
      # Last, once the release is out: the bucket keeps it, ISO and all, and
      # the newest final release, which systems that take no candidates are on
      # until the next final one. A system on an older release reads nothing
      # new from its folder, and nova update moves it on; releases newer than
      # this one, which a build beside it may be filling, stay.
      - name: Remove the releases before it from the bucket
        if: inputs.publish
        env:
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: nova-packages
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--older-than "$TAG")
          # GitHub's latest release is the newest final one; with none yet, none.
          stable=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          [[ -z $stable ]] || args+=(--keep "$stable")
          tools/packages-prune "${args[@]}" --delete
