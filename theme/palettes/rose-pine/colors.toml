# Rosé Pine Dawn (MIT), the light Rosé Pine, with the terminal colours of
# rose-pine/foot. Rosé Pine has no orange; gold stands in for it.
mode = "light"

background = "#faf4ed"          # base
dark_background = "#f4ede8"     # highlight low
lighter_background = "#f2e9e1"  # overlay
selection = "#dfdad9"           # highlight med

foreground = "#575279"          # text
light_foreground = "#797593"    # subtle
dark_foreground = "#9893a5"     # muted
muted = "#9893a5"               # muted

accent = "#d7827e"              # rose

red = "#b4637a"                 # love
green = "#56949f"               # foam
yellow = "#ea9d34"              # gold
blue = "#286983"                # pine
magenta = "#907aa9"             # iris
cyan = "#d7827e"                # rose

bright_red = "#df8aa0"
bright_green = "#7ebcc7"
bright_yellow = "#ffc55c"
bright_blue = "#538faa"
bright_magenta = "#b8a1d2"
bright_cyan = "#ffaaa5"
