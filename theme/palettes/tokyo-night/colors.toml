# Tokyo Night, its "night" style, as folke/tokyonight.nvim defines it
# (Apache-2.0), after enkia's Tokyo Night. Text, surfaces and the terminal's
# sixteen come from its palette and extras/foot/tokyonight_night.ini.
mode = "dark"

background = "#1a1b26"          # bg
dark_background = "#16161e"     # bg_dark
lighter_background = "#292e42"  # bg_highlight
selection = "#283457"           # the terminal's selection

foreground = "#c0caf5"          # fg
light_foreground = "#a9b1d6"    # fg_dark
dark_foreground = "#545c7e"     # dark3
muted = "#565f89"               # comment

accent = "#7aa2f7"              # blue
orange = "#ff9e64"

red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"

bright_red = "#f7768e"
bright_green = "#9ece6a"
bright_yellow = "#e0af68"
bright_blue = "#7aa2f7"
bright_magenta = "#bb9af7"
bright_cyan = "#7dcfff"
