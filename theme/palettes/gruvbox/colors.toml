# Gruvbox Material, dark, its medium background and "material" foreground,
# from sainnhe/gruvbox-material (MIT), a softer Gruvbox. Green is the colour
# its status line greets you with.
mode = "dark"

background = "#282828"          # bg0
dark_background = "#1b1b1b"     # bg_dim
lighter_background = "#32302f"  # bg1
selection = "#45403d"           # bg3, its Visual

foreground = "#d4be98"          # fg0
bright_foreground = "#ddc7a1"   # fg1
light_foreground = "#a89984"    # grey2
dark_foreground = "#7c6f64"     # grey0
muted = "#928374"               # grey1, its comments

accent = "#a9b665"              # green
orange = "#e78a4e"

red = "#ea6962"
green = "#a9b665"
yellow = "#d8a657"
blue = "#7daea3"
magenta = "#d3869b"             # purple
cyan = "#89b482"                # aqua

bright_red = "#ea6962"
bright_green = "#a9b665"
bright_yellow = "#d8a657"
bright_blue = "#7daea3"
bright_magenta = "#d3869b"
bright_cyan = "#89b482"
