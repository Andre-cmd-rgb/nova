# Installed as /etc/systemd/system/plymouth-quit.service.d/omarchy-boot-theme.conf
#
# Why the splash flashes away seconds before the login screen appears:
#
#   sddm.service     After=... plymouth-quit.service ...
#   plymouth-quit    ExecStart=-/usr/bin/plymouth quit
#
# So Plymouth is told to quit *first*, and a plain "quit" hides the splash and
# hands the console back — the screen goes black. SDDM only starts after that,
# and its greeter takes a second or two to come up and paint. That black window
# between the two is the gap.
#
# --retain-splash tells plymouthd to leave its last frame in the framebuffer on
# the way out instead of clearing it. Nothing else changes: the same service
# runs at the same point in the boot, Plymouth still exits and still releases
# the DRM device to SDDM. The image just stays on screen until SDDM paints over
# it, which is what makes the boot look continuous.
#
# The alternative — ordering plymouth-quit after display-manager.service so
# Plymouth keeps drawing until SDDM is up — is not used here. sddm.service is
# already ordered after plymouth-quit.service, so that would be an ordering
# cycle, and systemd breaks cycles by dropping an edge of its own choosing. A
# boot that sometimes races is worse than a boot with a seam in it.
#
# If SDDM ever fails to start, the retained splash is what stays on screen.
# Ctrl+Alt+F2 switches VT, which does a modeset and brings the console back.

[Service]
# Empty assignment first: ExecStart is a list, and this replaces it rather than
# appending a second command to it.
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
