# Nova's pacman configuration. The servers come from two files that nova update
# rewrites for every release: nova-mirrorlist, the Arch Linux Archive snapshot the
# release was tested against, and nova-repo, the release's own [nova] repository.
# Pacman will not see packages newer than the release until nova update moves it.

[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
Color
ParallelDownloads = 5
DownloadUser = alpm
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# First, so Nova's builds (linux-nova, the limine tools) win a name clash. Its
# database is signed as well as its packages (nova-keyring holds the key), so a
# stale or altered copy of the repository is refused.
[nova]
SigLevel = Required
Include = /etc/pacman.d/nova-repo

[core]
Include = /etc/pacman.d/nova-mirrorlist

[extra]
Include = /etc/pacman.d/nova-mirrorlist

# 32-bit libraries, for Steam and Wine.
[multilib]
Include = /etc/pacman.d/nova-mirrorlist
