# Nova's Rust components. One lock file and one target/ for all of them.
[workspace]
resolver = "2"
members = ["src/theme", "src/power/daemon", "src/power/undervolt", "src/screensaver", "src/airdrop/daemon", "src/apps", "src/sd", "src/session/daemon", "src/iphone/daemon", "src/preview", "src/account"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
