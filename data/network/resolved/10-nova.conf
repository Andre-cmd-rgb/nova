# Nova's name resolution beside NetworkManager's DNS servers. In
# /usr/lib/systemd/resolved.conf.d: nova dns writes /etc/systemd/resolved.conf,
# and a file in /etc/systemd/resolved.conf.d overrides this one.
[Resolve]
# LLMNR answers this computer's name to anyone on the network who asks, on
# every network joined, and nothing on a home network needs it.
LLMNR=no
# Avahi does mDNS: finding printers and scanners, and the .local names. Two
# responders on one computer get in each other's way.
MulticastDNS=no
