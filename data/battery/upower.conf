# Nova's UPower policy, installed as /etc/UPower/UPower.conf.d/10-nova.conf.
# A later file beside it (say 50-local.conf) overrides it.
[UPower]
# At the last few percent the computer hibernates: what is open goes to disk,
# and the power is cut. UPower's own Auto asks logind to sleep, which Nova
# makes suspend-then-hibernate, and its first half, sleep to RAM, is what
# empties the battery before the second half can write anything to disk.
CriticalPowerAction=Hibernate
