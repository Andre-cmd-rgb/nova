# Nova, ThinkPad P1 Gen 4i: keep the Bluetooth controller awake. With autosuspend
# on, a Bluetooth mouse lags on the first movement after a pause while the
# controller resumes. This is the AC behaviour: on battery nova-power lets it
# sleep after 10 s idle, because a controller pinned awake keeps the whole USB
# host awake and the package out of PC10 (docs/hardware/thinkpad-p1-gen4i.md,
# fact 54).
options btusb enable_autosuspend=n
