# Nova, ThinkPad P1 Gen 4i: no framebuffer console on the discrete card. Every
# display here is wired to the iGPU, and with fbdev=1 nvidia_drm registers a DRM
# client that holds a reference on itself from the moment it loads, which is
# what stops the power policy unloading it ("refs: 1, held by -"). modeset stays
# on: PRIME offload needs it.
options nvidia-drm fbdev=0
