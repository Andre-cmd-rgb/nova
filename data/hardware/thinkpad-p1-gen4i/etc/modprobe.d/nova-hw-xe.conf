# Nova, ThinkPad P1 Gen 4i: the xe driver is not loaded. Its list of cards
# names the Tiger Lake GPU too, so the kernel loads it beside i915, which is
# the one that takes the card: xe and the helpers only it uses (gpu_sched,
# drm_gpuvm, drm_gpusvm_helper, drm_suballoc_helper, drm_exec) then hold
# 4.8 MiB of kernel memory, which is never swapped, for nothing (lsmod: used
# by 0, and no device under /sys/bus/pci/drivers/xe; 2026-11-21, kernel
# 7.2.11). A model's own file, since on a newer Intel GPU xe is the driver.
blacklist xe
