# Nova, ThinkPad P1 Gen 4i. Takes effect when the boot entries are next rebuilt
# (any kernel update, or limine-update).
#   rtc_cmos.use_acpi_alarm=1
#     wake from S3 on the RTC alarm, which is how suspend-then-hibernate gets
#     from the suspend half to the hibernate half
KERNEL_CMDLINE[default]+=" rtc_cmos.use_acpi_alarm=1"
