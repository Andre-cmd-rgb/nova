# The desktop portals in a Nova session (XDG_CURRENT_DESKTOP=Hyprland), for
# every user: Hyprland's own for the screen and GTK's for the rest, as
# xdg-desktop-portal-hyprland has them, and gnome-keyring's for secrets,
# which it offers only to GNOME. Without that, a Flatpak app had nowhere to
# keep a password or a sign-in: Minecraft's launcher asked for the Microsoft
# account again at every start. Each app's secrets are its own.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
