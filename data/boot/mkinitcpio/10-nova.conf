# Nova initramfs: systemd-based and as small as the hardware allows.
#
# mkinitcpio reads /etc/mkinitcpio.conf first and this drop-in after it, so this
# HOOKS line replaces Arch's default.
#
# - systemd replaces udev: it also brings the resume= handling for hibernation, so
#   there is no separate `resume` hook.
# - autodetect shrinks the image to the modules this machine needs. The fallback
#   image (see limine-entry-tool.d/10-nova.conf) builds without it.
# - kms loads the GPU driver early so the firmware logo hands over to Hyprland
#   without a mode switch. NVIDIA is deliberately not loaded early: the nvidia
#   driver loads from the real root, and the iGPU or simpledrm covers the console.
# - consolefont and plymouth are left out on purpose: there is no splash. Nothing
#   prompts in the initramfs unless the root is encrypted, and then nova-install's
#   own drop-in, 20-nova-encrypt.conf, adds sd-vconsole and sd-encrypt to this
#   line, so the passphrase is typed in the keyboard layout picked.
# - sd-btrfs-overlayfs (from limine-entry-tool) mounts a tmpfs overlay when the root
#   is a read-only Limine snapshot, so greetd and Hyprland can start from it. It
#   does nothing on a normal boot.
HOOKS=(base systemd autodetect microcode modconf kms keyboard block filesystems sd-btrfs-overlayfs)

# zstd decompresses roughly three times faster than xz at a similar size.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-3)
