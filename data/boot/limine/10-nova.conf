# limine-entry-tool configuration for Nova. Sourced as shell by limine-entry-tool,
# limine-mkinitcpio and limine-snapper-sync, after /etc/limine-entry-tool.conf and
# before /etc/default/limine. The installer adds 90-nova-install.conf next to this
# file with the machine-specific root=, resume= and resume_offset= arguments.

# The ESP is always mounted at /boot (see the installer's partition layout).
ESP_PATH="/boot"
TARGET_OS_NAME="Nova"

# One signed-ready UKI per kernel instead of loose vmlinuz + initramfs. The short
# custom name keeps the file names friendly to picky firmware.
ENABLE_UKI=yes
CUSTOM_UKI_NAME="nova"

# Kernel command line, quiet end to end. The installer appends root and resume.
#   quiet loglevel=0 systemd.show_status=false rd.udev.log_level=0
#     nothing between the firmware logo and the lock screen
#   vt.global_cursor_default=0
#     no blinking console cursor during the hand-over
KERNEL_CMDLINE[default]+=" quiet loglevel=0 systemd.show_status=false rd.udev.log_level=0 vt.global_cursor_default=0"

# Keep a full (no autodetect) initramfs for the main kernel as a "-fallback" entry
# for boots after a hardware change, and install Limine as the default UEFI loader
# (EFI/BOOT/BOOTX64.EFI) so the firmware can boot even if its boot entries are
# wiped. nova-boot-check refuses kernel transactions while either is missing.
MKINITCPIO_FALLBACK=linux-nova
ENABLE_LIMINE_FALLBACK=yes

# linux-lts is installed next to linux-nova and gets an entry of its own, the
# kernel to try when a new linux-nova misbehaves.
BOOT_ORDER="linux-nova, *fallback, linux-lts, *, Snapshots"
FIND_BOOTLOADERS=no

# Snapshot entries in the boot menu. Three is enough to roll back an update; every
# extra entry costs ESP space for another kernel image. Fallback images are left out
# of snapshots for the same reason. So are post snapshots: each is the state the
# next pre snapshot also holds, and three entries then go back three changes, the
# one before an update included, instead of one and a half.
MAX_SNAPSHOT_ENTRIES=3
EXCLUDE_SNAPSHOT_ENTRIES="*fallback"
EXCLUDE_SNAPSHOT_TYPES="post"
SNAPSHOT_FORMAT_CHOICE=5
RESTORE_METHOD=replace
