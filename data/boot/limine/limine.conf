# Nova's Limine configuration header. The installer copies this file to
# /boot/limine.conf before the first limine-update; limine-entry-tool then appends
# the OS and kernel entries and limine-snapper-sync the snapshot entries below it.
# Options reference: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md

# Boot the default entry after one second without showing anything. A key press
# during that second reveals the menu with the fallback, LTS and snapshot entries.
# `nova recovery` asks for the menu explicitly (LoaderConfigTimeoutOneShot).
timeout: 1
quiet: yes

# Entry 1 is the Nova directory, entry 2 its first child: linux-nova (see BOOT_ORDER).
default_entry: 2

# A checksum mismatch (for example after FAT corruption) prints a warning and waits
# for a key instead of halting, so another entry can still be chosen.
hash_mismatch_panic: no

interface_branding: Nova
term_background: 000000
backdrop: 000000
term_foreground: d8d8d8
term_foreground_bright: ffffff
