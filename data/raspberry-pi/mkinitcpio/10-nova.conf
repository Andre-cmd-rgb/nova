# Nova's initramfs on a Raspberry Pi: Arch Linux ARM's own, less autodetect.
#
# mkinitcpio reads /etc/mkinitcpio.conf first and this drop-in after it, so this
# HOOKS line replaces Arch Linux ARM's.
#
# - autodetect is left out: the image is built on another machine, whose
#   drivers it would pick, and a Pi's root moves between a card, a USB stick
#   and an NVMe drive more often than a PC's disk does. The drivers for all of
#   them cost a few megabytes.
# - sd-vconsole carries the keyboard layout, for a prompt before the root is
#   mounted (an fsck that needs an answer).
HOOKS=(base systemd modconf kms keyboard sd-vconsole block filesystems fsck)
