# Nova's pacman configuration on a Raspberry Pi. Arch Linux ARM keeps no
# archive of old packages, so each release pins the ones it was tested with in
# a repository of its own, [nova-alarm]: a list of them on the release's
# server, signed with Nova's key, and their files on a server every release
# shares. nova update rewrites both servers' files for every release:
# nova-alarm and nova-repo, the release's own [nova] repository.
#
# pacman takes a package from the first repository that has it, so everything
# the release pinned stays at the release's version until nova update moves
# it on. Anything else, installed afterwards, comes from Arch Linux ARM as it
# is that day.

[options]
HoldPkg = pacman glibc
Architecture = aarch64
CheckSpace
Color
ParallelDownloads = 5
DownloadUser = alpm
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# First, so Nova's builds win a name clash. Its database is signed as well as
# its packages (nova-keyring holds the key), so a stale or altered copy of the
# repository is refused.
[nova]
SigLevel = Required
Include = /etc/pacman.d/nova-repo

# The release's list is signed with Nova's key, and every package in it is
# Arch Linux ARM's own, signed by its packagers (archlinuxarm-keyring).
[nova-alarm]
SigLevel = Required
Include = /etc/pacman.d/nova-alarm

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
