# Nova's sleep policy. Override in /etc/systemd/sleep.conf.d/.
[Sleep]
# Sleep to RAM first, then write it to disk and cut power: S3 costs about 1.3 W
# on a P1 Gen 4i, enough to flatten the battery over a long weekend in a bag.
HibernateDelaySec=2h

# On mains there is nothing to save, and a resume from disk costs a full POST.
# systemd's default would hibernate a laptop sitting on its charger.
HibernateOnACPower=no
