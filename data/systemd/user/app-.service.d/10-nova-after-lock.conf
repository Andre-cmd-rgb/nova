# Every app-*.service: what systemd makes of an XDG autostart entry
# (app-<name>@autostart.service), and what `uwsm app -t service` starts. One
# that starts with the session waits until nova-session-guard is done, so that
# on an autologin boot no window shows before the lock is secure. On a
# password login the guard is done once nova-session-first-unlock has run, a
# few seconds at most. One started later is not held: the guard has finished.
[Unit]
After=nova-session-guard.service
