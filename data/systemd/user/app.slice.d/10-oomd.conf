# systemd-oomd may end what runs in app.slice, and nothing else of the session.
#
# Every app started through uwsm-app is a scope in app.slice; Hyprland runs in
# session.slice. So when memory runs short, oomd ends the browser or terminal
# that ran it short, and the compositor lives to say so. (On user@.service the
# same lines would make Hyprland a candidate too.)
#
# Memory pressure is the usual sign; swap filling up, the slower one, ends an
# app too. Both limits are in /usr/lib/systemd/oomd.conf.d/10-nova.conf.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMSwap=kill
