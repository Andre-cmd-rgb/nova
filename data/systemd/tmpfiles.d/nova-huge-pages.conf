# Huge pages (2 MiB) are always on, as Arch's kernel has them: fewer page-table
# lookups for anything with a large heap. Two settings beside that, which the
# kernel leaves at values that cost memory, or huge pages. Written at boot
# only, on x86 only: the numbers count the 512 small pages of one huge page.

# As shipped (511) the kernel builds a huge page around a single small page
# that is in use, and never takes it back: a program that touches a little of
# a lot of memory holds far more than it uses. At 409 one is built only where a
# fifth is in use already, and under memory pressure one that is more than four
# fifths untouched is split and the untouched part freed (/proc/vmstat counts
# those as thp_underused_split_page, which stays 0 at 511).
w! /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409

# With no huge page free a program gets small pages at once, as before, and now
# the kernel also tidies memory in the background so the next one finds a huge
# page. The kernel's own default tidies only for programs that ask for huge
# pages by name, and makes those wait for it; they still do.
w! /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
