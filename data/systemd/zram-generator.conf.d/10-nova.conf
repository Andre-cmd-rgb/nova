# Compressed swap in RAM, used before the disk swap file. zstd averages about
# 3:1, so even a full device takes roughly a third of RAM; a smaller cap would
# spill ordinary reclaim to the disk. The swap file stays for hibernation:
# /sys/power/resume names it directly, so this priority never matters there.
[zram0]
zram-size = ram
compression-algorithm = zstd
swap-priority = 100
