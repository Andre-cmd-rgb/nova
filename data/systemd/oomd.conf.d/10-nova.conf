# systemd-oomd acts on memory pressure (PSI stall time), so one runaway app is
# stopped while the desktop is still thrashing, instead of the kernel OOM killer
# firing after an allocation has already failed somewhere fatal (Hyprland has
# been seen taking SIGBUS from a dying client's shm pool that way). earlyoom
# would not help: it waits for free RAM and free swap to both run low, and the
# swap file sized for hibernation keeps that from ever happening.
#
# Half of each ten-second window stalled on reclaim, for 20 s straight, means
# the desktop is already unusable and losing one app is the cheaper outcome.
# Only apps can be picked: see /usr/lib/systemd/user/app.slice.d/10-oomd.conf.
[OOM]
DefaultMemoryPressureDurationSec=20s
DefaultMemoryPressureLimit=50%
