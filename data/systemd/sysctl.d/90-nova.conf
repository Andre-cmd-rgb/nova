# Memory reclaim tuned for swap on zram (zram-generator.conf.d/10-nova.conf),
# which is orders of magnitude faster than the disk these defaults assume.

# Above 100: evicting an anonymous page to zram is cheaper than dropping page
# cache that has to be read back from disk. Not higher, because every page
# swapped still costs a compression now and a decompression later.
vm.swappiness = 150

# Keep the dentry and inode caches longer: they are costly to rebuild and
# cannot go to zram. Never 0, which can OOM.
vm.vfs_cache_pressure = 50

# One page per swap-in. Read-ahead pays for a seek zram does not have, and each
# extra page is another decompression.
vm.page-cluster = 0

# No watermark boost after fragmentation (it causes reclaim bursts while memory
# is still free), and about 1.25% kept free so kswapd reclaims in the background
# instead of allocations stalling in direct reclaim.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Write back dirty pages at 64 MiB and block writers at 256 MiB, instead of 10%
# and 20% of RAM, which lets gigabytes pile up and flush in stalls. With bursts
# that small the flusher can wake every 15 s instead of every 5.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
vm.dirty_writeback_centisecs = 1500

# VS Code, language servers and build watchers outgrow the default 8192.
fs.inotify.max_user_watches = 524288

# Find the path MTU when a link drops ICMP, which otherwise hangs SSH sessions.
net.ipv4.tcp_mtu_probing = 1
