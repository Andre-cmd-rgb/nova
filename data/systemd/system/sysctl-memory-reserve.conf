# The kernel's memory reserve depends on how much memory there is, which a
# sysctl.d file cannot say: nova-memory-reserve works it out and writes
# /run/sysctl.d/90-nova-memory-reserve.conf for systemd-sysctl to read with
# the rest. Should it fail, the kernel's own setting stays.
[Service]
ExecStartPre=-/usr/lib/nova/nova-memory-reserve
