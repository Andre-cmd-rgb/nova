# NTSYNC, the kernel's take on Windows' synchronization primitives, which Wine
# and Proton use for games' threads when /dev/ntsync is there (the kernel
# makes it readable and writable by everyone). The module names no device
# alias, so nothing loads it when a game asks: it is loaded at boot. Every
# kernel Nova installs builds it as a module. Arch's ntsync-autoload holds this
# same line, and depends on a kernel to do it.
ntsync
