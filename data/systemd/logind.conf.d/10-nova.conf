# Nova's logind policy. Override in /etc/systemd/logind.conf.d/.
[Login]
# The power key opens the system menu (XF86PowerOff in the Hyprland bindings);
# holding it still powers off in firmware.
HandlePowerKey=ignore

# Closing the lid, the suspend key and the menu's Suspend all "sleep": suspend,
# then hibernate after a while on battery (sleep.conf.d/10-nova.conf), or plain
# suspend on a machine that cannot hibernate.
HandleLidSwitch=sleep
HandleSuspendKey=sleep
SleepOperation=suspend-then-hibernate suspend

# nova-system-sleep-lock holds a delay inhibitor so the session is locked before the
# machine sleeps. A delay inhibitor is a timer, not a promise: logind sleeps
# anyway once it expires, and five seconds is not enough when closing the lid
# also reconfigures displays. A healthy lock releases it well under a second.
InhibitDelayMaxSec=15
