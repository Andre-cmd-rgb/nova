# Nova's settings for systemd itself (PID 1). Override in
# /etc/systemd/system.conf.d/.
[Manager]
# No hardware watchdog armed for the restart. systemd's default (10 min)
# opens /dev/watchdog as the computer goes down and closes it twice still
# running, once handing over to systemd-shutdown and once before the restart
# itself, so that a hang on the way resets the machine (src/core/main.c,
# src/shutdown/shutdown.c in systemd 262). The kernel says so each time, as a
# critical message on the console: "watchdog0: watchdog did not stop!", on
# every computer with a watchdog device (Intel's TCO and overclocking ones,
# AMD's sp5100_tco). A desktop's restart has somebody in front of it, who
# holds the power button long before ten minutes are up. The devices stay,
# for a RuntimeWatchdogSec set here by anyone who wants one; the kernel's
# lockup detectors (what nowatchdog turns off) are another thing, and stay on.
RebootWatchdogSec=off
