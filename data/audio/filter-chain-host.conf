# The PipeWire client that hosts Nova's speaker tuning: the least a client
# carrying a filter graph needs, after /usr/share/pipewire/filter-chain.conf.
#
# The tuning has a client of its own because PipeWire's filter-chain.conf
# loads every fragment in ~/.config/pipewire/filter-chain.conf.d/. Hosted
# there, the tuning would bring along any other filter kept in that
# directory, running it twice if something else hosts it too, and switching
# the tuning off would stop them all.
#
# nova-audio-tuning installs it as ~/.config/pipewire/nova-speaker-tuning.conf,
# with the tuning's graph in nova-speaker-tuning.conf.d/ beside it, and
# nova-speaker-tuning.service runs it as
#   pipewire -c nova-speaker-tuning.conf

# Errors only: a graph that fails to load says why in the journal
# (journalctl --user -u nova-speaker-tuning), and nothing else is logged.
context.properties = {
    log.level = 1
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    # Realtime priority for the audio thread, from RTKit itself as
    # pipewire.conf has it. Through the portal, one started before RTKit
    # reports a realtime budget of zero; that becomes RLIMIT_RTTIME 0 while
    # RTKit still makes the thread realtime, and the kernel kills the host as
    # soon as audio plays.
    { name = libpipewire-module-rt
        args = { rtportal.enabled = false }
        flags = [ ifexists nofail ]
    }

    # PipeWire's own protocol, to talk to the daemon.
    { name = libpipewire-module-protocol-native }

    # Lets the client offer nodes of its own: the filter's.
    { name = libpipewire-module-client-node }

    # Puts a converter and resampler around each node.
    { name = libpipewire-module-adapter }
]
