## Lenovo ThinkPad P1 Gen 4i internal speakers.
##
## Nine biquads and a lookahead limiter, applied as a PipeWire filter-chain in
## front of the internal speaker sink. The P1 Gen 4i has four 2 W drivers on a
## Realtek ALC287 with no smart amplifier and no vendor DSP on Linux, so the
## stock path is the raw driver response: thin below ~150 Hz, boxy through the
## low mids, and hard around 3-4 kHz.

description="ThinkPad P1 Gen 4i speakers"
## Matched on DMI product family, which reads exactly "ThinkPad P1 Gen 4i" on
## this machine. There is no Cirrus/Dell-style speaker firmware SKU to key on
## here, and the ALC287 speaker wiring is common to the model line.
match_dmi=("ThinkPad P1 Gen 4i")
## Unescaped dots: this is passed to awk as a string, where a backslash escape
## would be consumed before the regex sees it.
sink_pattern='^alsa_output.*skl_hda_dsp_generic.*HiFi__Speaker__sink$'

## Provenance. Derived from an EasyEffects chain built for this laptop and then
## refitted to biquads: the EasyEffects equalizer's "Hi-pass" at slope x4
## measured its -3 dB corner near 800 Hz rather than the 85 Hz it was set to, so
## the low-end control here is an explicit 4th-order Butterworth pair instead.
derived_from="hand-built EasyEffects profile for this machine"
validated_by="Andre-cmd-rgb"
validated_hardware="ThinkPad P1 Gen 4i"

## NOT measured against a reference. Unlike the shipped dell-xps-2026 tuning,
## this curve was designed from the known failure modes of a thin-chassis laptop
## speaker rather than fitted to a measured target, so it carries no
## magnitude_rms_db or group-delay figures. Treat it as a voicing, not a
## calibration, and re-measure before quoting numbers for it.
