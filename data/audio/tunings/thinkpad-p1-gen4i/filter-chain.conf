# Lenovo ThinkPad P1 Gen 4i speaker tuning.
#
# Calf BassEnhancer -> 10 biquads per channel -> stereo lookahead limiter.
# See tuning.conf for provenance: this is a designed voicing, not a fit to a
# measured reference.
#
# The exciter comes FIRST, before the high-pass, so it still sees the sub-bass it
# derives harmonics from. These drivers produce nothing useful below ~70 Hz, so
# the perceived low end has to come from harmonics in the 150-300 Hz range that
# they can reproduce -- boosting the fundamental instead just wastes excursion
# and adds intermodulation distortion.
#
# Low end is a 4th-order Butterworth high-pass (Q 0.5412 / 1.3066) rather than a
# shelf. Note the speaker path already rolls off hard below ~60 Hz on its own.
#
# Plain filter-chain sink, not a WirePlumber smart filter: on PipeWire 1.6.8 /
# WirePlumber 0.5.15 a smart filter links correctly then passes audio through
# unprocessed (the dell-xps-2026 tuning documents the same finding).
#
# Channels are wired explicitly because the exciter and limiter are stereo; a
# mono graph would be duplicated per channel and process each side
# independently, shifting the stereo image on bass transients.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type   = lv2
            name   = bass
            plugin = "http://calf.sourceforge.net/plugins/BassEnhancer"
            control = {
              "amount" = 4.0
              "drive" = 8.5
              "freq" = 120.0
              "blend" = 2.0
              "floor_active" = 1
              "floor" = 40.0
              "listen" = 0
              "level_in" = 1.0
              "level_out" = 1.0
            }
          }

          { type = builtin name = s0_l        label = bq_highpass  control = { "Freq" = 60.0 "Q" = 0.5412 } }
          { type = builtin name = s1_l        label = bq_highpass  control = { "Freq" = 60.0 "Q" = 1.3066 } }
          { type = builtin name = s2_l        label = bq_peaking   control = { "Freq" = 120.0 "Q" = 1.2 "Gain" = 2.5 } }
          { type = builtin name = s3_l        label = bq_peaking   control = { "Freq" = 175.0 "Q" = 1.0 "Gain" = 4.5 } }
          { type = builtin name = s4_l        label = bq_peaking   control = { "Freq" = 330.0 "Q" = 1.2 "Gain" = -1.0 } }
          { type = builtin name = s5_l        label = bq_peaking   control = { "Freq" = 900.0 "Q" = 1.1 "Gain" = -4.5 } }
          { type = builtin name = s6_l        label = bq_peaking   control = { "Freq" = 2000.0 "Q" = 1.5 "Gain" = -1.5 } }
          { type = builtin name = s7_l        label = bq_peaking   control = { "Freq" = 3800.0 "Q" = 1.8 "Gain" = -3.0 } }
          { type = builtin name = s8_l        label = bq_peaking   control = { "Freq" = 7000.0 "Q" = 1.2 "Gain" = 3.0 } }
          { type = builtin name = s9_l        label = bq_highshelf control = { "Freq" = 11000.0 "Q" = 0.707 "Gain" = 4.0 } }

          { type = builtin name = s0_r        label = bq_highpass  control = { "Freq" = 60.0 "Q" = 0.5412 } }
          { type = builtin name = s1_r        label = bq_highpass  control = { "Freq" = 60.0 "Q" = 1.3066 } }
          { type = builtin name = s2_r        label = bq_peaking   control = { "Freq" = 120.0 "Q" = 1.2 "Gain" = 2.5 } }
          { type = builtin name = s3_r        label = bq_peaking   control = { "Freq" = 175.0 "Q" = 1.0 "Gain" = 4.5 } }
          { type = builtin name = s4_r        label = bq_peaking   control = { "Freq" = 330.0 "Q" = 1.2 "Gain" = -1.0 } }
          { type = builtin name = s5_r        label = bq_peaking   control = { "Freq" = 900.0 "Q" = 1.1 "Gain" = -4.5 } }
          { type = builtin name = s6_r        label = bq_peaking   control = { "Freq" = 2000.0 "Q" = 1.5 "Gain" = -1.5 } }
          { type = builtin name = s7_r        label = bq_peaking   control = { "Freq" = 3800.0 "Q" = 1.8 "Gain" = -3.0 } }
          { type = builtin name = s8_r        label = bq_peaking   control = { "Freq" = 7000.0 "Q" = 1.2 "Gain" = 3.0 } }
          { type = builtin name = s9_r        label = bq_highshelf control = { "Freq" = 11000.0 "Q" = 0.707 "Gain" = 4.0 } }
          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # alr/boost default on; a fixed tuning must disable them or its
              # tone drifts with programme level.
              "alr" = 0
              "boost" = 0
              "g_in" = 0.7079
              "th" = 0.891
            }
          }
        ]

        links = [
          { output = "bass:out_l" input = "s0_l:In" }
          { output = "s0_l:Out" input = "s1_l:In" }
          { output = "s1_l:Out" input = "s2_l:In" }
          { output = "s2_l:Out" input = "s3_l:In" }
          { output = "s3_l:Out" input = "s4_l:In" }
          { output = "s4_l:Out" input = "s5_l:In" }
          { output = "s5_l:Out" input = "s6_l:In" }
          { output = "s6_l:Out" input = "s7_l:In" }
          { output = "s7_l:Out" input = "s8_l:In" }
          { output = "s8_l:Out" input = "s9_l:In" }
          { output = "s9_l:Out" input = "limiter:in_l" }
          { output = "bass:out_r" input = "s0_r:In" }
          { output = "s0_r:Out" input = "s1_r:In" }
          { output = "s1_r:Out" input = "s2_r:In" }
          { output = "s2_r:Out" input = "s3_r:In" }
          { output = "s3_r:Out" input = "s4_r:In" }
          { output = "s4_r:Out" input = "s5_r:In" }
          { output = "s5_r:Out" input = "s6_r:In" }
          { output = "s6_r:Out" input = "s7_r:In" }
          { output = "s7_r:Out" input = "s8_r:In" }
          { output = "s8_r:Out" input = "s9_r:In" }
          { output = "s9_r:Out" input = "limiter:in_r" }
        ]

        inputs  = [ "bass:in_l" "bass:in_r" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      # Loudness is the speakers' own volume, behind the tuning
      # (nova-audio-output-sink); the tuning's two volumes stay at 100%, so the
      # graph always sees full-scale input. Locked, a volume set on either is
      # ignored, and WirePlumber neither saves nor restores one: a volume it had
      # kept for the tuning (0.000125, from a slider that moved it once) made
      # the speakers silent at every start.
      capture.props = {
        node.name   = "nova_speaker_tuning"
        media.class = Audio/Sink
        channelmix.lock-volumes = true
        state.restore-props = false
      }
      playback.props = {
        node.name     = "nova_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
        channelmix.lock-volumes = true
        state.restore-props = false
      }
    }
  }
]
