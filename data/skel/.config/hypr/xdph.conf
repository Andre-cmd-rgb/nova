# Read by xdg-desktop-portal-hyprland when an app asks to share the screen:
# what it shares is chosen on Nova's card. nova-sessiond writes this file
# when it is missing; once here it is yours, and Nova leaves it be. Its other
# settings: https://wiki.hypr.land/Hypr-Ecosystem/xdg-desktop-portal-hyprland/
screencopy {
    custom_picker_binary = /usr/lib/nova/bin/nova-share-picker
}
