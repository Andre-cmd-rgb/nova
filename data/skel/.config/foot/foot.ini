# foot, the terminal: where Nova differs from foot's own defaults
# (/etc/xdg/foot/foot.ini). The colors follow the Nova theme; nova theme set
# rewrites theme.ini.
include=~/.config/foot/theme.ini

[main]
font=monospace:size=9
pad=14x14
workers=0

[scrollback]
lines=10000
multiplier=7.0

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
primary-paste=none
