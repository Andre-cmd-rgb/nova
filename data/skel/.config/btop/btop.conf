# btop. It rewrites this file with every option when it exits; these are the
# ones Nova cares about.
color_theme = "nova"
theme_background = false
truecolor = true
rounded_corners = true
vim_keys = true
shown_boxes = "cpu mem net proc"
update_ms = 2000
proc_sorting = "cpu lazy"
# Reading NVIDIA stats opens the card through NVML every update, which keeps a
# hybrid laptop's discrete GPU awake and stops it being powered off on
# battery. Add nvidia to see it.
shown_gpus = "amd intel"
