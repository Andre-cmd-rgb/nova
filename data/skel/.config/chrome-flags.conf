# Chrome's launcher reads one flag per line from here; lines starting with #
# are skipped, and a # anywhere else is not.
#
# Wayland itself, not Xwayland.
--ozone-platform=wayland
# Chrome cannot tell the login keyring is there under Hyprland, and without
# this keeps its passwords and cookies key unencrypted instead.
--password-store=gnome-libsecret
# Video decoded and encoded on the GPU. VaapiOnNvidiaGPUs matters only where an
# NVIDIA card is the one display controller.
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder,VaapiOnNvidiaGPUs
